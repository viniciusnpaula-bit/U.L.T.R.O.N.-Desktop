name: Desktop (U.L.T.R.O.N.)

# Só o Desktop: a pasta ULTRON-Mobile/ tem workflow próprio e não é afetada aqui.
on:
  push:
    branches: [main]
    paths-ignore:
      - 'ULTRON-Mobile/**'
      - '**.md'
  pull_request:
    paths-ignore:
      - 'ULTRON-Mobile/**'
      - '**.md'
  workflow_dispatch:

jobs:
  testes:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Sintaxe (py_compile)
        run: python -m compileall -q .

      - name: Testes de segurança do núcleo
        run: python -m unittest testes_seguranca

      - name: Testes do Desktop
        run: python -m pytest tests -q

      - name: Testes do shell Electron
        run: node --test electron/test/api.test.js

      - name: Testes da interface
        run: node --test electron/site/test/real.test.mjs

      - name: Verificar que nada proibido entrou
        shell: pwsh
        run: |
          $proibidos = @('.env', 'dados/', 'logs/', 'venv/', 'node_modules/', '__pycache__/')
          $achados = @()
          foreach ($p in $proibidos) {
            $achados += Get-ChildItem -Recurse -Force -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -like "*$p*" -and $_.FullName -notlike '*\.git\*' }
          }
          if ($achados.Count -gt 0) {
            $achados | Select-Object -First 10 FullName
            Write-Error "Itens proibidos no repositório."
          }
