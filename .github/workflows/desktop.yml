name: Desktop (U.L.T.R.O.N.)

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
  pull_request:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  testes:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Sintaxe (py_compile)
        run: python -m compileall -q .

      - name: Testes de segurança do núcleo
        run: python -m unittest testes_seguranca

      - name: Testes do Desktop
        run: python -m pytest tests -q

      - name: Testes do shell Electron
        run: node --test electron/test/api.test.js

      - name: Testes da interface
        run: node --test electron/site/test/real.test.mjs electron/site/test/handlers.test.mjs

      - name: Verificar que nada proibido entrou
        shell: pwsh
        run: |
          # Valida o que está VERSIONADO, não artefatos criados pelos testes
          # (pytest gera dados/, logs/ e __pycache__ durante o job).
          # ".env.example" é documentação e NÃO deve ser barrado.
          $proibidos = '(^|/)(\.env|dados|logs|venv|\.venv|node_modules|__pycache__)(/|$)'
          $achados = @(git ls-files | Where-Object { $_ -match $proibidos })
          if ($achados.Count -gt 0) {
            $achados | Select-Object -First 10
            Write-Error "Itens proibidos no repositório."
          }
